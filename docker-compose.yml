services:
  linkedin-mcp:
    image: hubertusgbecker/mcp-linkedin-server:latest
    build: .
    volumes:
      - ~/.linkedin-mcp:/home/pwuser/.linkedin-mcp
    environment:
      - LOG_LEVEL=WARNING
    command: ["--transport", "sse", "--host", "0.0.0.0", "--port", "8100", "--path", "/sse"]
    ports:
      - "8100:8100"
    restart: unless-stopped
