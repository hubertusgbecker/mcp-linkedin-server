services:
  linkedin-mcp:
    image: hubertusgbecker/mcp-linkedin-server:latest
    container_name: mcp-linkedin-server
    build: .
    volumes:
      - linkedin-mcp-data:/home/pwuser/.linkedin-mcp
    environment:
      - LOG_LEVEL=WARNING
      - PYTHONUNBUFFERED=1
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8100", "--path", "/mcp"]
    ports:
      - "8100:8100"
    restart: unless-stopped

volumes:
  linkedin-mcp-data:
