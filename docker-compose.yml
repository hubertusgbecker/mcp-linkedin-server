services:
  linkedin-mcp:
    image: hubertusgbecker/mcp-linkedin-server:latest
    container_name: mcp-linkedin-server
    build: .
    volumes:
      - ./data:/home/pwuser/.linkedin-mcp
    environment:
      - LOG_LEVEL=WARNING
      - PYTHONUNBUFFERED=1
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8100", "--path", "/mcp"]
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; r=u.Request('http://127.0.0.1:8100/mcp',method='POST',headers={'Content-Type':'application/json','Accept':'application/json, text/event-stream'},data=b'{\"jsonrpc\":\"2.0\",\"id\":0,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-03-26\",\"capabilities\":{},\"clientInfo\":{\"name\":\"healthcheck\",\"version\":\"1.0.0\"}}}'); h=u.urlopen(r); h.read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
